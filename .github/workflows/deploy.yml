name: Sync to Hugging Face Hub

on:
  push:
    branches: [main] # Agar aapki repo me branch ka naam 'master' hai toh yahan 'master' likhein
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Push to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force https://kpankaj1998:$HF_TOKEN@huggingface.co/spaces/kpankaj1998/PPTImageExtract main
